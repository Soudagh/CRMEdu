databaseChangeLog:
  - changeSet:
      id: 029-create-payment-table
      author: soudagh
      changes:
        - createTable:
            tableName: payment
            schemaName: crmedu
            remarks: table for student payment history
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_payment
              - column:
                  name: student_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payment_student_id_student
                    references: student(id)
              - column:
                  name: amount
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: payment_type
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: payment_date
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false